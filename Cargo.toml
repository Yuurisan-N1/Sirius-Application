[package]
name = "sirius-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Mining, mission and referral automation client for the Sirius app"

[[bin]]
name = "sirius-bot"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "gzip"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
